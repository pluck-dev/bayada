# 아카데미 v2 로컬 운영 스택 (개발 서버 3100/3200 과 별개)
#   cp deploy/.env.example deploy/.env   # 비밀값 채우기
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 나중에 AWS/Supabase 로 옮길 때:
#   - db      → Supabase/RDS. academy/admin 의 DATABASE_URL 만 바꾼다
#   - media   → S3+CloudFront 또는 R2. MEDIA_BASE_URL 로 데이터 이전을 다시 돌린다(docs/academy-v2-deploy.md)
#   - academy/admin → 같은 이미지를 ECS/App Runner 에 올린다
name: bayada-academy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: bayada
    ports: ["127.0.0.1:5435:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bayada"]
      interval: 5s
      retries: 20

  # 영상(MP4)과 옛 사이트 업로드 이미지를 정적 서빙한다. 운영에서는 S3/R2 로 대체
  media:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["${MEDIA_PORT:-4300}:80"]
    volumes:
      - ${VIDEO_DIR:?VIDEO_DIR 필요}:/srv/videos:ro
      - ${UPLOADS_DIR:?UPLOADS_DIR 필요}:/srv/uploads:ro
      - ./media.conf:/etc/nginx/conf.d/default.conf:ro

  academy:
    build: { context: .., args: { APP: academy } }
    image: bayada-academy:local
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ["${ACADEMY_PORT:-4100}:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      AUTH_SECRET: ${ACADEMY_AUTH_SECRET:?ACADEMY_AUTH_SECRET 필요}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${ACADEMY_URL:-http://localhost:4100}
      NEXT_PUBLIC_SITE_URL: ${ACADEMY_URL:-http://localhost:4100}
      # 결제(토스페이먼츠) — 클라이언트 키도 서버 런타임에 읽어 결제 페이지로 내려준다
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}

  admin:
    build: { context: .., args: { APP: admin } }
    image: bayada-admin:local
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    ports: ["${ADMIN_PORT:-4200}:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      AUTH_SECRET: ${ADMIN_AUTH_SECRET:?ADMIN_AUTH_SECRET 필요}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${ADMIN_URL:-http://localhost:4200}
      # 환불 처리(토스 결제 취소 API)
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}

volumes:
  pgdata:
