server {
    listen 80;
    add_header Access-Control-Allow-Origin * always;

    # 레슨 영상: 범위 요청(seek) 지원, 오래 캐시
    location /videos/ {
        alias /srv/videos/;
        types { video/mp4 mp4; }
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800";
    }

    # 옛 사이트 썸네일·첨부 (wp-content/uploads)
    location /uploads/ {
        alias /srv/uploads/;
        add_header Cache-Control "public, max-age=604800";
    }

    location / { return 404; }
}
