# EC2 한 대 운영 스택: Caddy(HTTPS) + web + academy + admin + Postgres + mailpit
#   cd /srv/bayada/app && docker compose -f deploy/ec2/docker-compose.yml --env-file deploy/ec2/.env up -d --build
# 영상·업로드 파일은 /srv/bayada/media/{videos,uploads}, DB 백업은 /srv/bayada/backups (deploy/ec2/backup.sh)
name: bayada

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      WEB_HOST: ${WEB_HOST}
      ACADEMY_HOST: ${ACADEMY_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      MEDIA_HOST: ${MEDIA_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/bayada/media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, academy, admin]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 필요}
      POSTGRES_DB: bayada
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bayada"]
      interval: 5s
      retries: 20

  # 운영 SMTP(SES 등)를 붙이기 전까지 메일은 여기 쌓인다 (외부 노출 안 함: ssh -L 8025:localhost:8025 로 확인)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]

  web:
    build: { context: ../.., args: { APP: web, NEXT_PUBLIC_SITE_URL: "https://${WEB_HOST}" } }
    image: bayada-web:prod
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      # 클라이언트 검수용 리뷰·피드백 도구 (비밀번호를 비우면 도구·API 모두 꺼진다)
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      REVIEW_ACCESS_PASSWORD: ${REVIEW_ACCESS_PASSWORD:-}
      REVIEW_ACCESS_SECRET: ${REVIEW_ACCESS_SECRET:-}

  academy:
    build: { context: ../.., args: { APP: academy, NEXT_PUBLIC_SITE_URL: "https://${ACADEMY_HOST}" } }
    image: bayada-academy:prod
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      AUTH_SECRET: ${ACADEMY_AUTH_SECRET:?ACADEMY_AUTH_SECRET 필요}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: https://${ACADEMY_HOST}
      NEXT_PUBLIC_SITE_URL: https://${ACADEMY_HOST}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-BAYADA Academy <no-reply@bayada.co.kr>}
      AUTH_KAKAO_ID: ${AUTH_KAKAO_ID:-}
      AUTH_KAKAO_SECRET: ${AUTH_KAKAO_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      REVIEW_ACCESS_PASSWORD: ${REVIEW_ACCESS_PASSWORD:-}
      REVIEW_ACCESS_SECRET: ${REVIEW_ACCESS_SECRET:-}

  admin:
    build: { context: ../.., args: { APP: admin, NEXT_PUBLIC_SITE_URL: "https://${ACADEMY_HOST}" } }
    image: bayada-admin:prod
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/bayada
      AUTH_SECRET: ${ADMIN_AUTH_SECRET:?ADMIN_AUTH_SECRET 필요}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: https://${ADMIN_HOST}
      ACADEMY_URL: https://${ACADEMY_HOST}
      # 피드백 "위치 보기" 링크가 여는 사이트 주소
      WEB_URL: https://${WEB_HOST}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-BAYADA Academy <no-reply@bayada.co.kr>}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
